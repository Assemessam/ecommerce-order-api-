x-app-runtime: &app-runtime
  build:
    context: .
  user: "${UID:-1000}:${GID:-1000}"
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
  environment:
    COMPOSER_HOME: /tmp/composer
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ecommerce_order_api
    DB_USERNAME: ecommerce
    DB_PASSWORD: secret
    REDIS_HOST: redis
    ORDER_EVENTS_QUEUE: "${ORDER_EVENTS_QUEUE:-order-events-local}"
    ORDER_EVENTS_QUEUE_CONNECTION: "${ORDER_EVENTS_QUEUE_CONNECTION:-order-redis}"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *app-runtime
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload", "--no-interaction"]
    ports:
      - "${APP_PORT:-8091}:8000"

  order-worker:
    <<: *app-runtime
    profiles: ["orders"]
    command: ["sh", "-c", 'exec php artisan queue:work "$${ORDER_EVENTS_QUEUE_CONNECTION:-order-redis}" --queue="$${ORDER_EVENTS_QUEUE:-order-events-local}" --sleep=1 --timeout=30 --tries=3 --max-time=3600 --memory=128 --no-interaction']
    stop_grace_period: 45s
    restart: unless-stopped

  order-scheduler:
    <<: *app-runtime
    profiles: ["orders"]
    command: ["php", "artisan", "schedule:work", "--no-interaction"]
    stop_grace_period: 75s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-15433}:5432"
    environment:
      POSTGRES_DB: ecommerce_order_api
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce_order_api"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_data:
